name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore RunnersDiary.sln

      - name: Build .NET solution
        run: dotnet build RunnersDiary.sln --no-restore

      - name: Test .NET solution
        run: dotnet test RunnersDiary.sln --no-build

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Generate TypeScript API types
        working-directory: web
        run: npm run generate:api

      - name: Verify generated API types are current
        run: git diff --exit-code -- web/src/api/generated/openapi.d.ts

      - name: Type-check frontend
        working-directory: web
        run: npm run typecheck

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build
